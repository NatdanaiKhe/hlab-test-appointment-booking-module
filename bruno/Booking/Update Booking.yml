info:
  name: Update Booking
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/booking/{{bookingId}}"
  body:
    type: json
    data: |-
      {
        "status":"COMPLETED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
